[tool:pytest]
# Pytest Configuration for RAG Benchmarking Project

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers
    --strict-markers
    # Strict config
    --strict-config
    # Coverage
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Warnings
    -W error::Warning
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    # Performance
    --durations=10
    # Output
    --tb=short

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require database/services)
    slow: Slow running tests
    asyncio: Async tests
    ingestion: Ingestion pipeline tests
    rag: RAG variant tests
    evaluation: Evaluation and scoring tests
    analysis: Analysis and visualization tests
    llm: Tests that call LLM APIs (may incur costs)
    skip_ci: Skip in CI/CD pipeline

# Async configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*
    */config/*
    */setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about protocols
    @protocol
    @typing.Protocol

[coverage:html]
directory = htmlcov

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout (prevent hanging tests)
timeout = 300
timeout_method = thread

# Filterwarnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install UV
      run: |
        # Linux/macOS
        if [ "$RUNNER_OS" != "Windows" ]; then
          curl -LsSf https://astral.sh/uv/install.sh | sh
        else
          # Windows
          powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
        fi
      shell: bash
    
    - name: Set up Python ${{ matrix.python-version }}
      run: |
        uv venv --python ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        uv pip install -e ".[dev]"
    
    - name: Run linters
      run: |
        uv run black --check src tests
        uv run isort --check-only src tests
        uv run flake8 src tests
    
    - name: Run type checking
      run: |
        uv run mypy src
    
    - name: Run tests
      env:
        # Set test environment variables
        POSTGRES_URL: postgresql://test:test@localhost:5432/test
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: test
      run: |
        uv run pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install UV
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    
    - name: Create virtual environment
      run: uv venv
    
    - name: Install dependencies
      run: uv pip install -e ".[dev]"
    
    - name: Check formatting
      run: |
        uv run black --check .
        uv run isort --check-only .
    
    - name: Lint with flake8
      run: uv run flake8 src tests
    
    - name: Type check with mypy
      run: uv run mypy src

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_benchmark
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install UV
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    
    - name: Create virtual environment
      run: uv venv
    
    - name: Install dependencies
      run: uv pip install -e ".[dev]"
    
    - name: Wait for services
      run: |
        sleep 10
        pg_isready -h localhost -p 5432 -U raguser || exit 1
    
    - name: Run integration tests
      env:
        POSTGRES_URL: postgresql://raguser:testpassword@localhost:5432/rag_benchmark
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: testpassword
      run: |
        uv run pytest tests/ -v -m integration

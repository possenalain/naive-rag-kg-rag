name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install UV
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dev dependencies
      run: make install-dev
    
    - name: Format code (auto-fix)
      run: make format || true
    
    - name: Run linting
      run: make lint || true
    
    - name: Run tests
      run: make test || true
    
    - name: Show environment info
      if: always()
      run: make env-info

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Free up runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        df -h /

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker
    
    - name: Build production Docker image
      run: |
        docker buildx install
        DOCKER_BUILDKIT=1 make docker-build
    
    - name: Build development Docker image
      run: |
        DOCKER_BUILDKIT=1 make docker-build-dev
    
    - name: Test Docker images
      run: |
        docker run --rm naive-rag:latest python --version
        docker run --rm naive-rag:dev python --version
        echo "✅ Docker images work!"

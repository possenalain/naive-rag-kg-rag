[project]
name = "naive-rag-kg-rag"
version = "0.1.0"
description = "A comprehensive benchmarking system to compare Naive RAG vs Knowledge Graph RAG"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alain", email = "possenalain21@gmail.com" }
]
license = { text = "MIT" }

dependencies = [
    # Core Dependencies
    "python-dotenv==1.0.0",
    "pydantic==2.11.0",
    "pydantic-settings==2.5.0",
    "pydantic-ai==0.3.0",
    
    # Database
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.9",
    "neo4j==5.28.0",
    "graphiti-core==0.12.4",
    
    # LLM & Embeddings
    "openai==1.90.0",
    "google-generativeai==0.8.0",
    "anthropic==0.54.0",
    "tiktoken==0.8.0",
    
    # FastAPI (if building API)
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "sse-starlette==2.3.0",
    
    # Data Processing
    "pandas==2.2.0",
    "numpy==2.0.0",
    "scipy==1.13.0",
    
    # NLP & Text Processing
    "nltk==3.9.1",
    "spacy==3.8.0",
    "sentence-transformers==3.3.0",
    
    # Visualization
    "matplotlib==3.9.0",
    "seaborn==0.13.0",
    "plotly==5.24.0",
    
    # Logging & Monitoring
    "loguru==0.7.2",
    "python-json-logger==2.0.7",
    
    # Async & Concurrency
    "aiohttp==3.11.0",
    "httpx==0.28.0",
    "tenacity==9.0.0",
    
    # CLI & Progress
    "click==8.1.7",
    "rich==13.7.1",
    "tqdm==4.67.0",
    
    # Jupyter Support
    "jupyter==1.1.1",
    "jupyterlab==4.3.0",
    "ipykernel==6.29.5",
    "ipywidgets==8.1.0",
    "notebook==7.3.0",
    "nest-asyncio==1.6.0",
    
    # Utils
    "python-dateutil==2.9.0",
    "pytz==2025.2",
    "pyyaml==6.0.2",
    "toml==0.10.2",
    
    # Development Tools
    "ipython==8.30.0",
    "ipdb==0.13.13",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.4.0",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-timeout==2.3.0",
    "faker==33.0.0",
    
    # Code Quality
    "black==24.10.0",
    "isort==5.13.0",
    "flake8==7.1.0",
    "mypy==1.13.0",
    "pylint==3.3.0",
]

docs = [
    # Documentation
    "mkdocs==1.6.0",
    "mkdocs-material==9.5.0",
]

[project.scripts]
rag-cli = "cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "faker>=33.0.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "flake8>=7.1.0",
    "mypy>=1.13.0",
    "pylint>=3.3.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--asyncio-mode=auto",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
]

[tool.pylint.format]
max-line-length = 100
